name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # Pinned, not floating: a ruff release can widen its default rule set or
      # change formatter output, either of which would turn this gate red on a
      # commit that changed nothing. Bumping it is then a deliberate PR with
      # the difference visible in the diff. Kept in step with uv.lock.
      - run: pip install ruff==0.16.0
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.x"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  # Version-free required status check for the branch ruleset. The matrix
  # legs above are named after their Python version, so binding the ruleset
  # to them meant editing it on every Python bump; bind it to this job instead.
  # `needs.test.result` is "success" only when every matrix leg succeeded.
  test-ok:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - if: needs.test.result != 'success'
        run: exit 1
